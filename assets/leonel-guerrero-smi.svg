<svg xmlns="http://www.w3.org/2000/svg" width="687" height="833" viewBox="0 0 687 833" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Animated terminal-style portfolio readout for Leonel Guerrero">
