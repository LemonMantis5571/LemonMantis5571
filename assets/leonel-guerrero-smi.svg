    <path d="M88 742c56-13 114-12 163 1" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M480 688c49-11 94-10 143 1" stroke-width="3" stroke-opacity="0.36"/>
  </g>
  <g class="float" style="--d:6s;--t:-3s" fill="#ffffff">
