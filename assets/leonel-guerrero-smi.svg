<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="aero-terminal-title aero-terminal-description">
<title id="aero-terminal-title">Leonel Guerrero's Frutiger Aero terminal portfolio</title>
<desc id="aero-terminal-description">A readable animated terminal window with glossy aqua glass, sky, water, and Leonel Guerrero's public projects.</desc>
<style>
  text { font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif; fill: #d9fbff; }
  .term { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 11px; }
  .term-small { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10px; }
  .term-large { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 13px; }
  .term-dim { fill: #76b6c8; }
  .term-muted { fill: #a2d2dd; }
  .term-white { fill: #f2ffff; }
  .term-cyan { fill: #8df9ff; }
  .term-green { fill: #9fffb5; }
  .term-pink { fill: #ffd2e7; }
  .term-yellow { fill: #fff0a6; }
  .fade { opacity: 0; animation: appear 0.01s linear var(--t) forwards; }
  .type { clip-path: inset(0 100% 0 0); animation: typing var(--d) steps(var(--n)) var(--t) forwards; }
  .cursor { fill: #8df9ff; animation: blink 1.1s step-end var(--t) infinite; }
  .cloud { animation: cloud-drift 12s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .cloud-right { animation-delay: -5s; animation-duration: 15s; }
  .bubble { animation: bubble-rise var(--d) ease-in-out var(--t) infinite; }
  .water-line { animation: water-shimmer 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .sun { animation: sun-pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .reflection { animation: reflection-sweep 5s ease-in-out infinite; }
  .terminal-action { transition: transform 220ms ease, filter 220ms ease; transform-box: fill-box; transform-origin: center; }
  a:hover .terminal-action, a:focus .terminal-action { transform: translateY(-2px); filter: url(#aero-glow); }
  @keyframes appear { to { opacity: 1; } }
  @keyframes typing { to { clip-path: inset(0 -2% 0 0); } }
  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
  @keyframes cloud-drift { from { transform: translateX(-7px); } to { transform: translateX(9px); } }
  @keyframes bubble-rise { 0% { opacity: 0; transform: translateY(18px) scale(0.8); } 15% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-76px) scale(1.12); } }
  @keyframes water-shimmer { 0%, 100% { opacity: 0.35; transform: translateX(-5px); } 50% { opacity: 0.85; transform: translateX(7px); } }
  @keyframes sun-pulse { 0%, 100% { opacity: 0.78; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes reflection-sweep { 0%, 20% { opacity: 0.05; transform: translateX(-16px); } 60%, 100% { opacity: 0.55; transform: translateX(20px); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .type, .cursor, .cloud, .bubble, .water-line, .sun, .reflection { animation: none; opacity: 1; clip-path: none; }
    .terminal-action { transition: none; }
  }
</style>
<defs>
  <linearGradient id="aero-sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eaffff"/>
    <stop offset="0.4" stop-color="#86e6ff"/>
    <stop offset="1" stop-color="#4b8fdf"/>
  </linearGradient>
  <linearGradient id="aero-hill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d9ffd8"/>
    <stop offset="0.5" stop-color="#73df9b"/>
    <stop offset="1" stop-color="#168d79"/>
  </linearGradient>
  <linearGradient id="aero-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#57dce7"/>
    <stop offset="1" stop-color="#236eb5"/>
  </linearGradient>
  <linearGradient id="aero-frame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
    <stop offset="0.48" stop-color="#c9f5ff" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#67bfe7" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="aero-chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaffff" stop-opacity="0.92"/>
    <stop offset="0.36" stop-color="#8de7f5" stop-opacity="0.78"/>
    <stop offset="1" stop-color="#2c87b9" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="terminal-glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c5b79" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#073a61" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#06284e" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="terminal-pane" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#052b51" stop-opacity="0.66"/>
    <stop offset="1" stop-color="#001b3a" stop-opacity="0.58"/>
  </linearGradient>
  <radialGradient id="aero-sun" cx="32%" cy="28%" r="72%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.32" stop-color="#fffbd2"/>
    <stop offset="0.76" stop-color="#ffd45a"/>
    <stop offset="1" stop-color="#ff9958"/>
  </radialGradient>
  <filter id="aero-shadow" x="-25%" y="-25%" width="150%" height="175%">
    <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#125477" flood-opacity="0.32"/>
  </filter>
  <filter id="aero-glow" x="-35%" y="-35%" width="170%" height="190%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8df9ff" flood-opacity="0.78"/>
  </filter>
  <filter id="sun-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="aero-scene-clip"><rect x="16" y="16" width="688" height="788" rx="30"/></clipPath>
</defs>

<rect width="720" height="820" rx="32" fill="#dffaff"/>
