<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="aero-title aero-description">
<title id="aero-title">Leonel Guerrero's Frutiger Aero portfolio dashboard</title>
<desc id="aero-description">An animated glossy sky-and-water portfolio dashboard showing Leonel Guerrero's projects, tools, and links.</desc>
<style>
  text { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; fill: #0d4162; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .eyebrow { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; fill: #0f72aa; }
  .muted { fill: #4a7a94; }
  .bright { fill: #f3ffff; }
  .white { fill: #ffffff; }
  .project-title { font-size: 11px; font-weight: 800; fill: #0d4162; }
  .project-stack { font-size: 9px; font-weight: 600; fill: #3d7892; }
  .project-mode { font-size: 9px; fill: #5c8ca1; }
  .fade { opacity: 0; animation: appear 0.01s linear var(--t) forwards; }
  .float { animation: drift var(--d) ease-in-out var(--t) infinite alternate; transform-box: fill-box; transform-origin: center; }
  .shimmer { animation: shine 5s ease-in-out infinite; }
  .water-line { animation: water 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .sun { animation: sun 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .hero-link-card, .project-cloud-link, .portfolio-link { transition: transform 220ms ease, filter 220ms ease; transform-box: fill-box; transform-origin: center; }
  a:hover .hero-link-card, a:focus .hero-link-card, a:hover .project-cloud-link, a:focus .project-cloud-link, a:hover .portfolio-link, a:focus .portfolio-link { transform: translateY(-3px); filter: url(#aero-glow); }
  @keyframes appear { to { opacity: 1; } }
  @keyframes drift { from { transform: translateY(-3px); } to { transform: translateY(5px); } }
  @keyframes shine { 0%, 20% { opacity: 0.18; transform: translateX(-18px); } 55%, 100% { opacity: 0.9; transform: translateX(28px); } }
  @keyframes water { 0%, 100% { transform: translateX(-5px); opacity: 0.46; } 50% { transform: translateX(7px); opacity: 0.9; } }
  @keyframes sun { 0%, 100% { transform: scale(0.94); opacity: 0.78; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .float, .shimmer, .water-line, .sun { animation: none; opacity: 1; }
    .hero-link-card, .project-cloud-link, .portfolio-link { transition: none; }
  }
</style>
<defs>
  <linearGradient id="aero-sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eaffff"/>
    <stop offset="0.42" stop-color="#8be7ff"/>
    <stop offset="1" stop-color="#5a91e6"/>
  </linearGradient>
  <linearGradient id="aero-sunset" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff6db"/>
    <stop offset="0.48" stop-color="#ffc0c8"/>
    <stop offset="1" stop-color="#8f9ae9"/>
  </linearGradient>
  <linearGradient id="aero-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
    <stop offset="0.45" stop-color="#e0fbff" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#8bd5f1" stop-opacity="0.42"/>
  </linearGradient>
  <linearGradient id="aero-card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
    <stop offset="0.55" stop-color="#e4fbff" stop-opacity="0.62"/>
    <stop offset="1" stop-color="#c0f1f5" stop-opacity="0.44"/>
  </linearGradient>
  <linearGradient id="aero-card-mint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#effff5" stop-opacity="0.88"/>
    <stop offset="1" stop-color="#a6efc2" stop-opacity="0.54"/>
  </linearGradient>
  <linearGradient id="aero-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#55dce4"/>
    <stop offset="1" stop-color="#2373ba"/>
  </linearGradient>
  <linearGradient id="aero-leaf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#deffd9"/>
    <stop offset="0.5" stop-color="#77e4a1"/>
    <stop offset="1" stop-color="#1a9e86"/>
  </linearGradient>
  <radialGradient id="aero-sun" cx="32%" cy="28%" r="72%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.3" stop-color="#fffbd3"/>
    <stop offset="0.75" stop-color="#ffd65a"/>
    <stop offset="1" stop-color="#ff9d59"/>
  </radialGradient>
  <filter id="aero-shadow" x="-25%" y="-25%" width="150%" height="175%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#15597e" flood-opacity="0.27"/>
  </filter>
  <filter id="aero-glow" x="-35%" y="-35%" width="170%" height="190%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#42cbe2" flood-opacity="0.7"/>
  </filter>
  <filter id="aero-sun-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="aero-scene-clip"><rect x="16" y="16" width="688" height="808" rx="30"/></clipPath>
</defs>

<rect width="720" height="840" rx="32" fill="#dff9ff"/>
