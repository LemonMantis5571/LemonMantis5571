<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="win7-terminal-title win7-terminal-description">
<title id="win7-terminal-title">Leonel Guerrero's Windows 7 terminal portfolio</title>
<desc id="win7-terminal-description">An animated Windows 7-style glass command prompt with sky, water, and Leonel Guerrero's public projects.</desc>
<style>
  text { font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif; fill: #e9fbff; }
  .term { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 11px; }
  .term-small { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10px; }
  .term-dim { fill: #83b8c9; }
  .term-muted { fill: #afd3dc; }
  .term-white { fill: #f5ffff; }
  .term-blue { fill: #a9edff; }
  .term-green { fill: #b0ffc0; }
  .term-pink { fill: #ffd7e8; }
  .term-yellow { fill: #fff0ad; }
  .fade { opacity: 0; animation: appear 0.01s linear var(--t) forwards; }
  .type { clip-path: inset(0 100% 0 0); animation: typing var(--d) steps(var(--n)) var(--t) forwards; }
  .cursor { fill: #a9edff; animation: blink 1.1s step-end var(--t) infinite; }
  .win7-cloud { animation: cloud-drift 12s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .win7-cloud-right { animation-delay: -5s; animation-duration: 15s; }
  .win7-bubble { animation: bubble-rise var(--d) ease-in-out var(--t) infinite; }
  .win7-water-line { animation: water-shimmer 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .win7-sun { animation: sun-pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .win7-reflection { animation: reflection-sweep 5s ease-in-out infinite; }
  .win7-action { transition: transform 180ms ease, filter 180ms ease; transform-box: fill-box; transform-origin: center; }
  a:hover .win7-action, a:focus .win7-action { transform: translateY(-2px); filter: url(#win7-glow); }
  @keyframes appear { to { opacity: 1; } }
  @keyframes typing { to { clip-path: inset(0 -2% 0 0); } }
  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
  @keyframes cloud-drift { from { transform: translateX(-7px); } to { transform: translateX(9px); } }
  @keyframes bubble-rise { 0% { opacity: 0; transform: translateY(18px) scale(0.8); } 15% { opacity: 0.72; } 100% { opacity: 0; transform: translateY(-76px) scale(1.12); } }
  @keyframes water-shimmer { 0%, 100% { opacity: 0.35; transform: translateX(-5px); } 50% { opacity: 0.85; transform: translateX(7px); } }
  @keyframes sun-pulse { 0%, 100% { opacity: 0.78; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes reflection-sweep { 0%, 20% { opacity: 0.05; transform: translateX(-16px); } 60%, 100% { opacity: 0.46; transform: translateX(20px); } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .type, .cursor, .win7-cloud, .win7-bubble, .win7-water-line, .win7-sun, .win7-reflection { animation: none; opacity: 1; clip-path: none; }
    .win7-action { transition: none; }
  }
</style>
<defs>
  <linearGradient id="win7-sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#efffff"/>
    <stop offset="0.42" stop-color="#91e8ff"/>
    <stop offset="1" stop-color="#5596e0"/>
  </linearGradient>
  <linearGradient id="win7-hill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e1ffd9"/>
    <stop offset="0.5" stop-color="#83dfa0"/>
    <stop offset="1" stop-color="#269479"/>
  </linearGradient>
  <linearGradient id="win7-water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#61dce5"/>
    <stop offset="1" stop-color="#2870b4"/>
  </linearGradient>
  <linearGradient id="win7-frame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
    <stop offset="0.44" stop-color="#d7f6ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#77bee5" stop-opacity="0.56"/>
  </linearGradient>
  <linearGradient id="win7-titlebar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9fbff" stop-opacity="0.94"/>
    <stop offset="0.25" stop-color="#94e2f4" stop-opacity="0.92"/>
    <stop offset="0.58" stop-color="#4d9dce" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#1b619e" stop-opacity="0.98"/>
  </linearGradient>
  <linearGradient id="win7-terminal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#145b77" stop-opacity="0.96"/>
    <stop offset="0.48" stop-color="#0a4168" stop-opacity="0.96"/>
    <stop offset="1" stop-color="#062b53" stop-opacity="0.98"/>
  </linearGradient>
  <linearGradient id="win7-pane" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03294d" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#001b38" stop-opacity="0.68"/>
  </linearGradient>
  <linearGradient id="win7-button" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
    <stop offset="0.45" stop-color="#e6f4fb" stop-opacity="0.94"/>
    <stop offset="1" stop-color="#b7d5e7" stop-opacity="0.96"/>
  </linearGradient>
  <radialGradient id="win7-sun" cx="32%" cy="28%" r="72%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.32" stop-color="#fffbd8"/>
    <stop offset="0.76" stop-color="#ffd65c"/>
    <stop offset="1" stop-color="#ff9d5a"/>
  </radialGradient>
  <filter id="win7-shadow" x="-25%" y="-25%" width="150%" height="175%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#125477" flood-opacity="0.34"/>
  </filter>
  <filter id="win7-glow" x="-35%" y="-35%" width="170%" height="190%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#a9edff" flood-opacity="0.78"/>
  </filter>
  <filter id="win7-sun-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="win7-scene-clip"><rect x="16" y="16" width="688" height="788" rx="8"/></clipPath>
</defs>

