<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="win7-title win7-desc">
  <title id="win7-title">Leonel Guerrero's Windows 7 terminal portfolio</title>
  <desc id="win7-desc">A readable Windows 7 style command prompt showing Leonel Guerrero's public projects and portfolio links.</desc>

  <style>
    text { font-family: "Segoe UI", "SegoeUI", "Noto Sans", sans-serif; fill: #000000; }
    .terminal { font-family: Consolas, "Courier New", monospace; font-size: 10.5px; fill: #ffffff; }
    .terminal-small { font-family: Consolas, "Courier New", monospace; font-size: 9.5px; fill: #ffffff; }
    .terminal-blue { fill: #aaddfa; }
    .terminal-surface { fill: #f0f0f0; }
    .terminal-muted { fill: #cfcfcf; }
    .terminal-selected { fill: #000000; }
    .ui { font-size: 11px; }
    .ui-muted { font-size: 10px; fill: #838383; }
    .w7-button-label { font-size: 11px; }
    .w7-button-rect { transition: filter 120ms ease; }
    a:hover .w7-button-rect, a:focus .w7-button-rect { fill: url(#w7-button-hover); filter: url(#w7-glow); }
    a:active .w7-button-rect { fill: url(#w7-button-active); }
    .blink { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>

  <defs>
    <!-- 7.css window palette: --w7-w-bg, --w7-w-grad, --w7-w-bd -->
    <linearGradient id="w7-window-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="w7-titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="w7-control" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="w7-button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#f2f2f2"/>
      <stop offset="0.45" stop-color="#ebebeb"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <linearGradient id="w7-button-hover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#eaf6fd"/>
      <stop offset="0.45" stop-color="#bee6fd"/>
      <stop offset="1" stop-color="#a7d9f5"/>
    </linearGradient>
    <linearGradient id="w7-button-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#e5f4fc"/>
      <stop offset="0.5" stop-color="#c4e5f6"/>
      <stop offset="0.5" stop-color="#98d1ef"/>
      <stop offset="1" stop-color="#68b3db"/>
    </linearGradient>
    <linearGradient id="w7-close" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a197" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#cf796a"/>
      <stop offset="0.5" stop-color="#cf796a"/>
      <stop offset="0.5" stop-color="#d54f36"/>
      <stop offset="1" stop-color="#d54f36"/>
    </linearGradient>
    <linearGradient id="w7-close-hover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb9d8b"/>
      <stop offset="0.25" stop-color="#ee6d56"/>
      <stop offset="0.5" stop-color="#ee6d56"/>
      <stop offset="0.5" stop-color="#d42809"/>
      <stop offset="1" stop-color="#d42809"/>
    </linearGradient>
    <filter id="w7-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="w7-glow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2aceda" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Desktop-sized canvas and the 7.css window frame. -->
  <rect width="720" height="820" fill="#f0f0f0"/>
  <rect x="10" y="10" width="700" height="800" rx="6" fill="#4580c4" stroke="#000000" stroke-opacity="0.7" filter="url(#w7-shadow)"/>
  <rect x="11" y="11" width="698" height="798" rx="5" fill="url(#w7-window-grad)"/>
  <path d="M16 166h688v40H16Z" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="16" y="16" width="688" height="788" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.87"/>

  <!-- 7.css title bar: #4580c4, #000000b3, white inset highlight. -->
  <rect x="18" y="18" width="684" height="58" rx="6" fill="#4580c4" stroke="#000000" stroke-opacity="0.7"/>
  <rect x="19" y="19" width="682" height="56" rx="5" fill="url(#w7-titlebar)"/>
  <rect x="20" y="20" width="680" height="54" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>

  <rect x="32" y="35" width="18" height="18" rx="2" fill="#3c7fb1" stroke="#ffffff" stroke-opacity="0.8"/>
  <path d="M36 44h10M41 39v10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="54" font-size="12" fill="#000000" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2" paint-order="stroke">Command Prompt — C:\Users\Leonel\portfolio</text>

  <!-- Window controls use the exact 7.css normal and close gradients. -->
  <g>
    <rect x="576" y="28" width="29" height="25" rx="5" fill="url(#w7-control)" stroke="#000000" stroke-opacity="0.3"/>
    <rect x="577" y="29" width="27" height="23" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
    <path d="M585 47h11" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="605" y="28" width="29" height="25" rx="5" fill="url(#w7-control)" stroke="#000000" stroke-opacity="0.3"/>
    <rect x="606" y="29" width="27" height="23" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
    <rect x="614" y="37" width="11" height="9" fill="none" stroke="#000000" stroke-width="1.4"/>

    <rect x="634" y="28" width="48" height="25" rx="5" fill="url(#w7-close)" stroke="#000000" stroke-opacity="0.3"/>
    <rect x="635" y="29" width="46" height="23" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
    <path d="M651 36l14 11M665 36l-14 11" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 7.css window body and status surfaces. -->
  <rect x="24" y="76" width="672" height="720" fill="#f0f0f0" stroke="#000000" stroke-opacity="0.7"/>
  <rect x="25" y="77" width="670" height="718" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>

  <rect x="42" y="94" width="636" height="28" fill="url(#w7-button)" stroke="#8e8f8f"/>
  <rect x="43" y="95" width="634" height="26" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
  <text x="52" y="113" class="ui">C:\Users\Leonel\portfolio</text>
  <text x="668" y="113" text-anchor="end" class="ui-muted">Windows 7 profile shell</text>

  <!-- High-contrast console content so the terminal remains readable. -->
  <rect x="42" y="134" width="636" height="430" fill="#000000" stroke="#8e8f8f"/>
  <rect x="43" y="135" width="634" height="428" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="58" y="164" class="terminal"><tspan class="terminal-blue">Microsoft Windows [Version 7.0]</tspan></text>
  <text x="58" y="185" class="terminal">C:\Users\Leonel\portfolio&gt; portfolio-smi --theme=win7 --projects=public</text>
  <text x="58" y="206" class="terminal"><tspan class="terminal-blue">[OK]</tspan><tspan> Welcome to Leonel's portfolio.</tspan></text>
  <text x="58" y="227" class="terminal"><tspan class="terminal-blue">[OK]</tspan><tspan> web apps, developer tools, automation, ML, and games.</tspan></text>
  <text x="58" y="248" class="terminal"><tspan class="terminal-blue">[OK]</tspan><tspan> readout online · human-powered runtime</tspan></text>
  <path d="M58 260h600" stroke="#ffffff" stroke-opacity="0.5" stroke-dasharray="4 4"/>

  <text x="58" y="281" class="terminal-small"><tspan class="terminal-blue">IDX</tspan><tspan x="92" class="terminal-blue">PROJECT</tspan><tspan x="320" class="terminal-blue">STACK</tspan><tspan x="472" class="terminal-blue">MODE</tspan></text>
  <path d="M58 290h600" stroke="#ffffff" stroke-opacity="0.7"/>

  <text x="58" y="310" class="terminal-small"><tspan>0</tspan><tspan x="92" class="terminal-blue">Git-AutoCommit</tspan><tspan x="320">Python + Gemini</tspan><tspan x="472">AI tooling</tspan></text>
  <rect x="52" y="318" width="616" height="21" fill="#aaddfa"/>
