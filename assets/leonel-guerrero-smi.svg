  <text x="58" y="357" class="terminal-small"><tspan>2</tspan><tspan x="92" class="terminal-blue">MCP-Discord-Image...</tspan><tspan x="320">Python + MCP</tspan><tspan x="472">Automation</tspan></text>
  <text x="58" y="381" class="terminal-small"><tspan>3</tspan><tspan x="92" class="terminal-blue">Moodle-Skill</tspan><tspan x="320">Docs + agents</tspan><tspan x="472">Contracts</tspan></text>
  <text x="58" y="405" class="terminal-small"><tspan>4</tspan><tspan x="92" class="terminal-blue">Pokemon-ImageClassifier</tspan><tspan x="320">PyTorch + ResNet</tspan><tspan x="472">ML lab</tspan></text>
  <text x="58" y="429" class="terminal-small"><tspan>5</tspan><tspan x="92" class="terminal-blue">PokeMMO-UI-Stats</tspan><tspan x="320">Java + data</tspan><tspan x="472">Stats</tspan></text>
  <text x="58" y="453" class="terminal-small"><tspan>6</tspan><tspan x="92" class="terminal-blue">LimeBot-OS</tspan><tspan x="320">Python + AI</tspan><tspan x="472">Assistant</tspan></text>
  <text x="58" y="477" class="terminal-small"><tspan>7</tspan><tspan x="92" class="terminal-blue">SilentFail</tspan><tspan x="320">TypeScript + Next</tspan><tspan x="472">Monitoring</tspan></text>
  <text x="58" y="501" class="terminal-small"><tspan>8</tspan><tspan x="92" class="terminal-blue">Ethereal-Theme</tspan><tspan x="320">JS + VS Code</tspan><tspan x="472">TUI themes</tspan></text>
  <path d="M58 517h600" stroke="#ffffff" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <text x="58" y="538" class="terminal-small"><tspan class="terminal-blue">STATUS:</tspan><tspan> 9 public repositories · links ready</tspan><tspan class="blink">_</tspan></text>

  <!-- 7.css status-bar surface. -->
  <rect x="42" y="580" width="636" height="38" fill="#f0f0f0" stroke="#000000" stroke-opacity="0.7"/>
  <path d="M43 581h634" stroke="#ffffff" stroke-opacity="0.6"/>
  <path d="M177 581v36M390 581v36M558 581v36" stroke="#cfcfcf"/>
